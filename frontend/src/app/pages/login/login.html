<div class="login-wrap">
    <div class="login-box">
        <h2>DeloitteEdge</h2>
        <p>Expense & Approval System - Sign in to continue</p>

        <div class="alert alert-error" *ngIf="error">{{ error }}</div>

        <div class="form-group">
            <label>Email Address</label>
            <input type="email" [(ngModel)]="email" placeholder="you@deloitteedge.co.uk" (keyup.enter)="login()">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" [(ngModel)]="password" placeholder="Password" (keyup.enter)="login()">
        </div>
        <button class="btn btn-primary" style="width:100%; margin-top:8px" (click)="login()" [disabled]="loading">
            {{ loading ? 'Signing in...' : 'Sign In' }}
        </button>

        <div class="mt-16" style="border-top:1px solid #eee; padding-top:14px">
            <p class="text-muted" style="margin-bottom:8px">Demo accounts (all use Password123!):</p>
            <div style="display:grid; gap:4px">
                <button class="btn btn-secondary btn-sm" (click)="fillDemo('tom.bradley@deloitteedge.co.uk')">Employee -
                    Tom Bradley</button>
                <button class="btn btn-secondary btn-sm" (click)="fillDemo('sarah.mitchell@deloitteedge.co.uk')">Manager
                    - Sarah Mitchell</button>
                <button class="btn btn-secondary btn-sm"
                    (click)="fillDemo('michael.hartley@deloitteedge.co.uk')">Finance - Michael Hartley</button>
                <button class="btn btn-secondary btn-sm" (click)="fillDemo('admin@deloitteedge.co.uk')">Admin</button>
            </div>
        </div>
    </div>
</div>
