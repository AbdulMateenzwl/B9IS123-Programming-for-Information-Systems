info:
  name: Get All Users
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/users"
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.body && res.body.length > 0) {
          bru.setEnvVar("userId", res.body[0]._id);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
