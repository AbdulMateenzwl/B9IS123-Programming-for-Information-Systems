info:
  name: Update User (Admin only)
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{baseUrl}}/users/{{userId}}"
  body:
    type: json
    data: |-
      {
        "jobTitle": "Principal Auditor",
        "role": "manager"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
