info:
  name: Update Department (Admin only)
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{baseUrl}}/departments/{{departmentId}}"
  body:
    type: json
    data: |-
      {
        "location": "Manchester",
        "managerName": "Updated Manager Name"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
