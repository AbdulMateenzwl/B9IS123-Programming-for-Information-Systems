info:
  name: Get All Departments
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/departments"
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.body && res.body.length > 0) {
          bru.setEnvVar("departmentId", res.body[0]._id);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
