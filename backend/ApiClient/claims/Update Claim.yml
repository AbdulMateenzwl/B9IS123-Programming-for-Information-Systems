info:
  name: Update Claim
  type: http
  seq: 5

http:
  method: PATCH
  url: "{{baseUrl}}/claims/{{claimId}}"
  body:
    type: json
    data: |-
      {
        "description": "Client site visit - Leeds office (updated)",
        "currency": "GBP"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
