info:
  name: Upload Attachment
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/attachments/{{claimId}}"
  body:
    type: multipart-form
    data:
      - name: file
        type: file
        value:
          - /home/mateen/Downloads/Abdul.Mateen.Receptionist.pdf
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.body && res.body._id) {
          bru.setEnvVar("attachmentId", res.body._id);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  ## Upload Attachment
  - Replace /path/to/your/receipt.pdf with a real file path
  - Allowed types: PDF, JPG, JPEG, PNG (BR15)
  - Max file size: 10MB (BR15)
  - Claim must belong to the logged-in user (or Admin)
