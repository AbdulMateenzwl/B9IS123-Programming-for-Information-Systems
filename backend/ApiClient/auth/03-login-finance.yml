info:
  name: Login (Finance Officer)
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/auth/login"
  body:
    type: json
    data: |-
      {
        "email": "michael.hartley@deloitteedge.co.uk",
        "password": "Password123!"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 201 || res.status === 200) {
          bru.setEnvVar("token", res.body.token);
          bru.setEnvVar("refreshToken", res.body.refreshToken);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
