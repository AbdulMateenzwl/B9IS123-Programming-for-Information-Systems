info:
  name: Refresh Token
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/auth/refresh"
  body:
    type: json
    data: |-
      {
        "refreshToken": "{{refreshToken}}"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 201 || res.status === 200) {
          bru.setEnvVar("token", res.body.token);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
