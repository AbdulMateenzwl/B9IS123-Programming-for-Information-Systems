info:
  name: Update Item
  type: http
  seq: 3

http:
  method: PATCH
  url: "{{baseUrl}}/claims/{{claimId}}/items/{{itemId}}"
  body:
    type: json
    data: |-
      {
        "amount": 155.00,
        "itemDescription": "Train London to Leeds return (updated)"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
